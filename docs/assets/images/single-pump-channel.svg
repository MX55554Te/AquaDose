<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">AquaDose single pump channel low-side N-MOSFET wiring</title>
  <desc id="desc">Technical schematic showing 12 volt pump supply positive to pump positive, pump negative to N-MOSFET drain, source to common ground, ESP32 GPIO through 100 ohm resistor to gate, 10 kilo-ohm gate pull-down to source/common ground, and flyback diode across the pump with stripe to 12 volts.</desc>
  <style>
    .bg { fill: #f8fbff; }
    .component { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 10; }
    .label { font-family: Arial, Helvetica, sans-serif; fill: #172033; font-size: 18px; }
    .small { font-size: 15px; fill: #374151; }
    .tiny { font-size: 13px; fill: #4b5563; }
    .title { font-size: 28px; font-weight: 700; }
    .wire { fill: none; stroke-width: 6; stroke-linejoin: round; stroke-linecap: square; }
    .thin { stroke-width: 3; }
    .red { stroke: #dc2626; }
    .black { stroke: #111827; }
    .blue { stroke: #2563eb; }
    .gate { stroke: #9333ea; }
    .orange { stroke: #f97316; }
    .drain { stroke: #64748b; }
    .node { fill: #ffffff; stroke-width: 3; }
    .node.red { stroke: #dc2626; }
    .node.black { stroke: #111827; }
    .node.gate { stroke: #9333ea; }
    .node.drain { stroke: #64748b; }
    .warn { fill: #fff7ed; stroke: #f97316; stroke-width: 2; rx: 10; }
    .legend-box { fill: #ffffff; stroke: #d8e2ef; stroke-width: 2; rx: 10; }
  </style>

  <rect class="bg" x="0" y="0" width="1200" height="760"/>
  <text class="label title" x="40" y="48">Single Pump Channel Wiring: low-side logic-level N-MOSFET</text>

  <rect class="component" x="50" y="82" width="165" height="96"/>
  <text class="label" x="72" y="120">12V pump</text>
  <text class="label" x="72" y="145">power supply</text>
  <text class="small" x="72" y="166">+ and - outputs</text>

  <rect class="component" x="50" y="365" width="170" height="135"/>
  <text class="label" x="87" y="408">ESP32</text>
  <text class="small" x="74" y="438">GPIO output</text>
  <text class="small" x="74" y="474">GND pin</text>

  <rect class="component" x="580" y="165" width="185" height="105"/>
  <text class="label" x="615" y="210">Pump motor</text>
  <text class="small" x="600" y="240">Pump +</text>
  <text class="small" x="685" y="240">Pump -</text>

  <rect class="component" x="660" y="390" width="160" height="150"/>
  <text class="label" x="684" y="427">N-MOSFET</text>
  <text class="small" x="697" y="456">Drain</text>
  <text class="small" x="690" y="503">Source</text>
  <text class="small" x="673" y="528">Gate at left</text>

  <rect class="component" x="300" y="390" width="120" height="42"/>
  <text class="small" x="306" y="417">100&#937; gate resistor</text>

  <rect class="component" x="530" y="515" width="70" height="86"/>
  <text class="small" x="543" y="552">10k&#937;</text>
  <text class="tiny" x="536" y="575">gate</text>
  <text class="tiny" x="528" y="592">pull-down</text>

  <polyline class="wire red" points="215,126 672,126 672,165"/>
  <polyline class="wire black" points="132,178 132,650 1035,650"/>
  <polyline class="wire drain" points="672,270 672,350 740,350 740,390"/>
  <polyline class="wire black" points="740,540 740,650"/>
  <polyline class="wire blue" points="220,428 300,428"/>
  <polyline class="wire gate" points="420,428 562,428 562,465 660,465"/>
  <polyline class="wire gate" points="562,465 562,515"/>
  <polyline class="wire black" points="562,601 562,650"/>
  <polyline class="wire black" points="220,474 255,474 255,650"/>

  <circle class="node red" cx="672" cy="126" r="7"/>
  <circle class="node drain" cx="672" cy="270" r="7"/>
  <circle class="node drain" cx="740" cy="350" r="7"/>
  <circle class="node black" cx="740" cy="650" r="7"/>
  <circle class="node gate" cx="562" cy="465" r="7"/>
  <circle class="node black" cx="562" cy="650" r="7"/>
  <circle class="node black" cx="255" cy="650" r="7"/>

  <text class="small" x="690" y="122">+12V to Pump +</text>
  <text class="small" x="782" y="356">Pump - to MOSFET Drain</text>
  <text class="small" x="628" y="622">MOSFET Source</text>
  <text class="small" x="628" y="644">to Common GND</text>
  <text class="small" x="250" y="388">ESP32 GPIO</text>
  <text class="small" x="470" y="410">Gate signal</text>
  <text class="small" x="602" y="582">10k&#937; gate pull-down resistor</text>

  <polyline class="wire red thin" points="672,165 850,165 850,205"/>
  <polyline class="wire drain thin" points="850,260 850,290 672,290 672,270"/>
  <line class="black thin" x1="826" y1="204" x2="874" y2="204"/>
  <polygon points="850,248 826,224 874,224" fill="none" stroke="#111827" stroke-width="3"/>
  <line class="black thin" x1="850" y1="224" x2="850" y2="248"/>
  <text class="small" x="880" y="198">Flyback diode,</text>
  <text class="small" x="880" y="220">stripe to +12V</text>
  <text class="tiny" x="880" y="242">Cathode/stripe at pump +</text>
  <text class="tiny" x="880" y="260">Anode at pump - / drain</text>

  <rect class="warn" x="52" y="550" width="390" height="86"/>
  <text class="label" x="72" y="580">Do not power pump motors from ESP32 pins</text>
  <text class="small" x="72" y="608">GPIO drives only the MOSFET gate through 100&#937;.</text>

  <rect class="legend-box" x="820" y="545" width="330" height="135"/>
  <text class="label" x="840" y="574">Legend</text>
  <line class="wire red" x1="840" y1="598" x2="900" y2="598"/><text class="small" x="912" y="604">+12V pump supply</text>
  <line class="wire black" x1="840" y1="623" x2="900" y2="623"/><text class="small" x="912" y="629">Common GND</text>
  <line class="wire blue" x1="840" y1="648" x2="900" y2="648"/><text class="small" x="912" y="654">ESP32 GPIO signal</text>
  <line class="wire gate" x1="840" y1="673" x2="900" y2="673"/><text class="small" x="912" y="679">MOSFET gate wiring</text>

  <text class="label" x="105" y="695">Common GND: ESP32 GND, buck GND, MOSFET source,</text>
  <text class="label" x="105" y="722">and 12V PSU negative must be connected together.</text>
</svg>
