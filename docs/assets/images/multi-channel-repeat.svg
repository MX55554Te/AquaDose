<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AquaDose multi-channel pump wiring repeat blocks</title>
  <desc id="desc">Clean technical overview showing that all eight AquaDose pump channels repeat the same low-side N-MOSFET wiring block with red 12 volt pump supply bus, black common ground bus, blue GPIO gate signals, 100 ohm gate resistors, 10k ohm gate pull-down resistors, and flyback diodes with stripe to 12 volts.</desc>
  <style>
    .bg { fill: #f8fbff; }
    .card { fill: #ffffff; stroke: #d8e2ef; stroke-width: 2; rx: 10; }
    .component { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 7; }
    .label { font-family: Arial, Helvetica, sans-serif; fill: #172033; font-size: 18px; }
    .small { font-size: 14px; fill: #374151; }
    .tiny { font-size: 12px; fill: #4b5563; }
    .title { font-size: 28px; font-weight: 700; }
    .wire { fill: none; stroke-width: 5; stroke-linejoin: round; stroke-linecap: square; }
    .thin { stroke-width: 3; }
    .red { stroke: #dc2626; }
    .black { stroke: #111827; }
    .blue { stroke: #2563eb; }
    .gate { stroke: #9333ea; }
    .drain { stroke: #64748b; }
    .node { fill: #ffffff; stroke-width: 3; }
    .node.red { stroke: #dc2626; }
    .node.black { stroke: #111827; }
    .node.gate { stroke: #9333ea; }
    .node.drain { stroke: #64748b; }
    .legend-box { fill: #ffffff; stroke: #d8e2ef; stroke-width: 2; rx: 10; }
  </style>

  <rect class="bg" x="0" y="0" width="1200" height="720"/>
  <text class="label title" x="40" y="46">Multi-channel repeat blocks</text>
  <text class="small" x="42" y="76">Each card repeats the exact low-side MOSFET circuit shown above.</text>

  <line class="wire red" x1="70" y1="116" x2="1130" y2="116"/>
  <text class="label" x="80" y="106">+12V pump supply bus</text>
  <line class="wire black" x1="70" y1="336" x2="1130" y2="336"/>
  <text class="label" x="80" y="365">Common GND bus</text>

  <line class="wire red" x1="70" y1="408" x2="1130" y2="408"/>
  <text class="label" x="80" y="398">+12V pump supply bus</text>
  <line class="wire black" x1="70" y1="628" x2="1130" y2="628"/>
  <text class="label" x="80" y="657">Common GND bus</text>

